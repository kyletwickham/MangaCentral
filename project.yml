# XcodeGen recipe: the cloud Mac turns this into an Xcode project, then builds it.
name: MangaCentral
options:
  bundleIdPrefix: com.kylewickham
  deploymentTarget:
    iOS: "17.0"
targets:
  MangaCentral:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    scheme: {}
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: MangaCentral
        CFBundleShortVersionString: "0.4"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets you see the app's Library folder in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kylewickham.mangacentral
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
        # Unsigned build: Sideloadly signs it with your Apple ID.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
